name: build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
